org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 8.7.3 (see android/build.gradle.kts) was only tested up to compileSdk 35, but
# Google Play now requires targeting API 36 for new apps — the build works fine at 36,
# this just silences the "untested" warning. Revisit once AGP officially supports 36
# (would also need a Gradle wrapper bump — see gradle/wrapper/gradle-wrapper.properties).
android.suppressUnsupportedCompileSdk=36

# Default for local builds. CI overrides this with -Pversion=<latest tag>, derived from
# Conventional Commits by the top-level release workflow — see
# .github/workflows/release.yml and .github/workflows/release_android.yml.
version=0.1.0
