org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Bumped by ./gradlew -PsetVersionConventional=true (se.bjurr.gitchangelog.git-changelog-gradle-plugin,
# see android/build.gradle.kts), driven by Conventional Commits since the last tag. The three
# patterns below must be set as plain Gradle properties (not just task config) because the
# `setVersionConventional` early-bump path reads them from properties directly.
version=0.1.0
majorVersionPattern=^\\w+(\\([^)]+\\))?!:|BREAKING CHANGE
minorVersionPattern=^feat
patchVersionPattern=^fix
