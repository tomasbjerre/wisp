build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"] # Compose functions are conventionally PascalCase.

style:
  MagicNumber:
    active: false # GPS/geo math is full of legitimate constants (radii, thresholds).
  ReturnCount:
    max: 4 # guard clauses are idiomatic here.

complexity:
  TooManyFunctions:
    active: false
  LongParameterList:
    functionThreshold: 10 # plain data-carrying calls (points, fixes), not complex logic.
