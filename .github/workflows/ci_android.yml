name: CI Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: tomasbjerre/.github/.github/workflows/bundle-android-ci.yaml@master

  # Kept local rather than folded into bundle-android-ci.yaml: the GPS
  # simulation and instruction-video recording below are Wisp-specific — see
  # instrumented_android.yml. Runs here too (not just from Release Android)
  # so a broken instrumented test fails the PR that broke it instead of the
  # next release (see #93).
  instrumented:
    uses: ./.github/workflows/instrumented_android.yml
