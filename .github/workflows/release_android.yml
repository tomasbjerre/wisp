name: Release Android

# Manual trigger, run after "Release" has tagged a version (see release.yml). Builds
# and publishes the Android app for the latest tag in the repo — it doesn't create a
# tag or touch CHANGELOG.md itself.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Used below to re-encode the recorded video for player compatibility — not on
      # this runner's PATH inside the emulator-runner action's script: block (confirmed
      # "ffmpeg: not found" there), even though it's normally preinstalled on
      # ubuntu-latest, so install it explicitly rather than assume it's reachable.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Without this, every run pays for a fresh system-image download and a cold AVD
      # boot (observed ~3-4 minutes of the "Run instrumented..." step below) — the
      # official reactivecircus/android-emulator-runner-recommended pattern: cache the
      # AVD's own files, and only actually create/boot-and-snapshot one (the step
      # below) when the cache misses.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented screenshot and video test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ./android
          script: |
            # Fix a location up front so Tracking has a real position to show instead of
            # hanging on "Finding your location…" — see InstructionVideoTest.
            adb emu geo fix 18.0686 59.3293
            # ScreenshotTest's live-Tracking captures and InstructionVideoTest's
            # Pause/Continue segment need actual movement, not just a fixed point —
            # recording only starts once a fix implies at least walking pace (see
            # specs/tracking.md#start-gating). Feed a slow walk north for the whole test
            # run (~6.5 minutes, well past both tests' combined runtime) in the
            # background; killed below once connectedDebugAndroidTest finishes. One
            # line, not a multi-line for loop — see the comment below on why.
            (for i in $(seq 1 200); do adb emu geo fix 18.0686 "$(awk -v i="$i" 'BEGIN{printf "%.6f", 59.3293 + i*0.000045}')"; sleep 2; done) &
            WALK_PID=$!
            # Belt-and-suspenders over the explicit kill below: this script runs with
            # errexit, so a failing ./gradlew line (as in the CI run that first exposed
            # this) exits the shell immediately, skipping every line after it — without
            # this trap, the loop above keeps running for its full ~6.5 minutes after the
            # emulator has already been torn down, spamming "could not connect to TCP
            # port 5554" into the log for the rest of the job.
            trap 'kill "$WALK_PID" 2>/dev/null || true' EXIT
            # /sdcard's emulated storage can lag a few seconds behind sys.boot_completed
            # (already waited for by this point) on a freshly booted emulator — without
            # this, screenrecord has occasionally failed outright with "Unable to open
            # ... No such file or directory" and produced no video at all. One line, not
            # a multi-line for loop: this action appears to run script: one line at a
            # time, so a `for ... do` spanning several lines breaks with a syntax error.
            for i in $(seq 1 15); do adb shell touch /sdcard/.wisp-ready 2>/dev/null && break; sleep 1; done
            adb shell rm -f /sdcard/.wisp-ready
            # Assemble first, unrecorded — screenrecord is capped at 180s, and the build
            # (a minute or more) was eating most or all of that before any app UI ever
            # appeared, so the video showed nothing but the Android launcher. Recording
            # now starts right before connectedDebugAndroidTest, which at this point only
            # has to install the already-built APKs before the on-device flow begins.
            ./gradlew assembleDebug assembleDebugAndroidTest
            adb shell screenrecord --time-limit 180 /sdcard/wisp-instruction-video.mp4 &
            RECORD_PID=$!
            ./gradlew connectedDebugAndroidTest
            # Stopped with SIGINT (not left to hit --time-limit) so screenrecord finalizes
            # the mp4 container's trailing moov atom instead of producing a file every
            # player rejects as corrupt. Must be sent to the *remote* screenrecord
            # process via its own adb shell call — killing the local `adb shell &`
            # client above (e.g. `kill -INT "$RECORD_PID"`) just drops the connection
            # without ever reaching screenrecord's signal handler.
            adb shell pkill -INT screenrecord 2>/dev/null || true
            wait "$RECORD_PID" 2>/dev/null || true
            sleep 2
            adb pull /sdcard/wisp-instruction-video.mp4 instruction-video-raw.mp4 || true
            # screenrecord's raw output has known non-monotonic timestamps that ffmpeg and
            # most players tolerate but VLC's decoder rejects outright ("Codec not
            # supported"). Re-encoding (not just remuxing) normalizes that and the pixel
            # format/profile into something every common player handles.
            if [ -s instruction-video-raw.mp4 ]; then ffmpeg -y -fflags +genpts -i instruction-video-raw.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart instruction-video.mp4 || cp instruction-video-raw.mp4 instruction-video.mp4; fi
            adb pull /sdcard/wisp-screenshots screenshots-raw

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/screenshots-raw
          retention-days: 1

      - name: Upload instruction video
        uses: actions/upload-artifact@v4
        with:
          name: instruction-video
          path: android/instruction-video.mp4
          retention-days: 1
          if-no-files-found: warn

  release:
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # See release.yml: the default GITHUB_TOKEN can't push to main under its
          # ruleset (required "build" check) — RELEASE_PAT (an admin-owned PAT) can.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Use the latest tag as the version
        run: |
          RELEASE_TAG=$(git describe --tags --abbrev=0)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: android/app/src/main/play/listings/en-US/graphics/phone-screenshots-raw

      # If the video step upstream produced nothing, this artifact still exists (empty)
      # because of that step's if-no-files-found: warn — the video is attached to the
      # GitHub Release for human review, it's never required for publishing to Play.
      - name: Download instruction video
        uses: actions/download-artifact@v4
        with:
          name: instruction-video
          path: android/video-raw

      - name: Install screenshots into the Play listing and README
        run: |
          # screencap (see ScreenshotTest) only writes PNG, and an uncompressed PNG of a
          # satellite map capture runs several MB — re-encoded as JPEG here since these
          # land in git history on every release and the visual difference at this
          # content (photographic map tiles, not sharp-edged UI) is negligible. -strip
          # drops PNG metadata JPEG has no use for.
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p app/src/main/play/listings/en-US/graphics/phone-screenshots
          rm -f app/src/main/play/listings/en-US/graphics/phone-screenshots/*.jpg
          for f in app/src/main/play/listings/en-US/graphics/phone-screenshots-raw/*.png; do
            name=$(basename "$f" .png)
            convert "$f" -strip -quality 87 "app/src/main/play/listings/en-US/graphics/phone-screenshots/$name.jpg"
          done
          rm -rf app/src/main/play/listings/en-US/graphics/phone-screenshots-raw
          mkdir -p ../docs/screenshots
          rm -f ../docs/screenshots/*.jpg
          cp app/src/main/play/listings/en-US/graphics/phone-screenshots/*.jpg ../docs/screenshots/

      - name: Write this release's notes (Play)
        run: |
          echo "Wisp $VERSION" > app/src/main/play/release-notes/en-US/default.txt
          git log "${PREVIOUS_TAG}..${RELEASE_TAG}" \
            --pretty=format:'- %s' | head -c 450 >> app/src/main/play/release-notes/en-US/default.txt || true

      - name: Commit screenshots and release notes (local only — not pushed yet)
        run: |
          git add app/src/main/play ../docs/screenshots
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit."
            echo "SCREENSHOTS_COMMITTED=false" >> "$GITHUB_ENV"
          else
            git commit -m "chore(android): update screenshots and play listing"
            echo "SCREENSHOTS_COMMITTED=true" >> "$GITHUB_ENV"
          fi

      # Pushed here, before the Play publish attempt below, not after: the emulator run
      # that produces these is the expensive part (several minutes), and Play publish
      # can fail for reasons that have nothing to do with the build (e.g. a brand-new
      # app whose store listing/content rating/data safety form isn't fully completed
      # in the Play Console yet — publishing there is a required one-time manual step,
      # see android/README.md#play-store-release). No need to redo the screenshots and
      # video just to retry that.
      - name: Push screenshots and release notes
        if: env.SCREENSHOTS_COMMITTED == 'true'
        run: git push origin HEAD

      # Signing config is resolved from ANDROID_KEYSTORE_* env vars at Gradle
      # *evaluation* time (see android/app/build.gradle.kts), not persisted across
      # invocations. Building and publishing in one ./gradlew call, sharing one
      # evaluation, keeps the bundle actually signed all the way to upload — a prior
      # version split these into two invocations and the second one (with only
      # ANDROID_PUBLISHER_CREDENTIALS set) silently re-signed the bundle as unsigned,
      # which Play rejects with "All uploaded bundles must be signed."
      - name: Build signed release bundle and APK, then publish to Play Console
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew -Pversion="$VERSION" assembleRelease bundleRelease publishReleaseBundle publishListing

      # if: always() so the video (and whatever of the APK/bundle actually got built)
      # still lands on the GitHub Release even if the Play publish step above failed —
      # each file is checked for existence first since a failure earlier in that step
      # can mean the APK/bundle were never produced at all.
      - name: Attach the release build to the GitHub Release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # git-changelog-github-release (see release.yml) creates the GitHub Release
          # itself tagged "$VERSION" (no "v"), even though the git tag it's cut from is
          # "$RELEASE_TAG" ("v$VERSION") — gh release commands need the former.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            UPLOAD_FILES=()
            [ -f app/build/outputs/apk/release/app-release.apk ] &&
              UPLOAD_FILES+=(app/build/outputs/apk/release/app-release.apk)
            [ -f app/build/outputs/bundle/release/app-release.aab ] &&
              UPLOAD_FILES+=(app/build/outputs/bundle/release/app-release.aab)
            [ -s video-raw/instruction-video.mp4 ] && UPLOAD_FILES+=(video-raw/instruction-video.mp4)
            # Screenshots are also committed to git (Play listing + docs/screenshots) —
            # attaching them here too just makes them downloadable straight from the
            # release, without needing to check out the repo.
            for f in app/src/main/play/listings/en-US/graphics/phone-screenshots/*.jpg; do
              [ -f "$f" ] && UPLOAD_FILES+=("$f")
            done
            if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
              gh release upload "$VERSION" "${UPLOAD_FILES[@]}" --clobber
            else
              echo "::warning::Nothing to attach to ${VERSION}."
            fi
          else
            echo "::warning::No GitHub release found for ${VERSION} (run the 'Release' workflow first) — skipping upload."
          fi
