name: Instrumented Android

# The emulator run behind every screenshot, the instruction video, and every
# instrumented test in android/app/src/androidTest. Reusable, so that Release Android
# (release_android.yml) and pull-request CI (ci_android.yml) run exactly the same job:
# the first time a broken instrumented test shows up should be on the PR that broke
# it, not halfway through a release (see #93).
on:
  workflow_call:

defaults:
  run:
    working-directory: android

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # A normal run (emulator boot + both retry attempts + teardown) takes well under 15
    # minutes (slowest observed success: ~13 min) — this caps a stuck run at a fast,
    # visible failure instead of GitHub's 360-minute default job timeout.
    #
    # This isn't a rare edge case: android-emulator-runner's own teardown spins
    # (observed retrying "could not connect to TCP port 5554" indefinitely) on *every*
    # run where connectedDebugAndroidTest fails, including an ordinary flaky-test
    # failure that itself only takes ~4-5 minutes — so without this cap, a ten-second
    # assertion failure turns into GitHub's full default timeout before the run reports
    # anything. 20 minutes measured the hang correctly but gave it 7+ minutes more than
    # any real run needs; 15 is tight against the slowest success while still well
    # clear of it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Used below to re-encode the recorded video for player compatibility — not on
      # this runner's PATH inside the emulator-runner action's script: block (confirmed
      # "ffmpeg: not found" there), even though it's normally preinstalled on
      # ubuntu-latest, so install it explicitly rather than assume it's reachable.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Without this, every run pays for a fresh system-image download and a cold AVD
      # boot (observed ~3-4 minutes of the "Run instrumented..." step below) — the
      # official reactivecircus/android-emulator-runner-recommended pattern: cache the
      # AVD's own files, and only actually create/boot-and-snapshot one (the step
      # below) when the cache misses.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented screenshot and video test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ./android
          disable-animations: true
          script: |
            # The AVD is restored from a cached snapshot (see the AVD cache step above),
            # and /sdcard persists as part of that snapshot — without this, a screenshot
            # left over from whatever ScreenshotTest looked like when that snapshot was
            # taken survives untouched (ScreenshotTest only ever adds/overwrites its own
            # named files, never clears the directory first), so a later `adb pull`
            # silently returns extra, stale images alongside the current ones. Confirmed:
            # a leftover "3-detail.png" from before ScreenshotTest was renumbered rode
            # along for months, pushing the Play listing to 9 screenshots and failing
            # `publishReleaseListing` with "You can only upload 8 phoneScreenshots."
            #
            # Retried, not a single call: right after boot, /sdcard's FUSE layer isn't
            # reliably up yet (the same lag documented below for screenrecord), and
            # `adb shell rm -rf` on it fails every file with "Bad address" instead of
            # just not finding them — confirmed killing this step outright across
            # several recent runs within 1-2s of boot_completed, before any test ran.
            # One line, not a multi-line for loop — see the comment below on why.
            for i in $(seq 1 15); do adb shell rm -rf /sdcard/wisp-screenshots && break; sleep 1; done
            # Fix a location up front so Tracking has a real position to show instead of
            # hanging on "Finding your location…" — see InstructionVideoTest.
            ./scripts/replay-real-track.sh --first-fix-only
            # ScreenshotTest's live-Tracking captures and InstructionVideoTest's
            # Pause/Continue segment need actual movement, not just a fixed point —
            # recording only starts once a fix implies at least walking pace (see
            # specs/tracking.md#start-gating). Replay the real recorded walk from #121 in
            # the background for the whole test run; stopped explicitly below, once it's
            # no longer needed (a sentinel file the loop polls for every iteration, not
            # `kill "$!"` on its PID — tried that and it did not reliably stop the loop).
            # One line, not a multi-line for loop — see the comment below on why.
            #
            # The whole fixture (every point in the CSV, not just its first 200), because
            # this suite has grown a test class at a time (each paying its own real
            # activity-launch/DB/UI cost before ScreenshotTest's turn, alphabetically
            # among the last) to where 200 points (~6.5 minutes of replay) ran out before
            # ScreenshotTest ever got there — the walk had already reached its last point
            # and gone still, so captureTrackingStates' wait for continued movement
            # (specs/tracking.md#start-gating) timed out for good, not intermittently:
            # every run of the full suite reproduced it. Passing more points than the CSV
            # actually has is fine — `head -n` in the script just stops at what's there.
            #
            # Deliberately NOT a `trap ... EXIT`: this action appears to run each line of
            # this script: block as its own `sh -c` invocation (confirmed from a run's own
            # log: consecutive lines each show as a separate `[command]/usr/bin/sh -c
            # <line>` entry) — background jobs and plain variables started on one line are
            # still visible to later lines (that's the existing RECORD_PID/wait pattern
            # below), but a `trap ... EXIT` set on a line with nothing else on it fires
            # essentially immediately, when that line's own single-line shell exits, not
            # at the end of the whole script. That fired this loop's stop file within
            # seconds of starting it, starving ScreenshotTest's movement-dependent
            # captures of any real walk and failing the run with a ComposeTimeoutException
            # instead. An explicit line run after the last command that needs the walk
            # (below) is what actually works here, matching the RECORD_PID pattern.
            rm -f /tmp/wisp-walk-stop
            ./scripts/replay-real-track.sh 100000 /tmp/wisp-walk-stop &
            # /sdcard's emulated storage can lag a few seconds behind sys.boot_completed
            # (already waited for by this point) on a freshly booted emulator — without
            # this, screenrecord has occasionally failed outright with "Unable to open
            # ... No such file or directory" and produced no video at all. One line, not
            # a multi-line for loop: this action appears to run script: one line at a
            # time, so a `for ... do` spanning several lines breaks with a syntax error.
            for i in $(seq 1 15); do adb shell touch /sdcard/.wisp-ready 2>/dev/null && break; sleep 1; done
            adb shell rm -f /sdcard/.wisp-ready
            # Assemble first, unrecorded — screenrecord is capped at 180s, and the build
            # (a minute or more) was eating most or all of that before any app UI ever
            # appeared, so the video showed nothing but the Android launcher. Recording
            # now starts right before connectedDebugAndroidTest, which at this point only
            # has to install the already-built APKs before the on-device flow begins.
            ./gradlew assembleDebug assembleDebugAndroidTest
            adb shell screenrecord --time-limit 180 /sdcard/wisp-instruction-video.mp4 &
            RECORD_PID=$!
            # The runner executes each line as its own command, so the retry is a
            # single-line `||`: one retry absorbs an occasional emulator timing flake.
            ./gradlew connectedDebugAndroidTest || ./gradlew connectedDebugAndroidTest
            # Stopped with SIGINT (not left to hit --time-limit) so screenrecord finalizes
            # the mp4 container's trailing moov atom instead of producing a file every
            # player rejects as corrupt. Must be sent to the *remote* screenrecord
            # process via its own adb shell call — killing the local `adb shell &`
            # client above (e.g. `kill -INT "$RECORD_PID"`) just drops the connection
            # without ever reaching screenrecord's signal handler.
            adb shell pkill -INT screenrecord 2>/dev/null || true
            wait "$RECORD_PID" 2>/dev/null || true
            touch /tmp/wisp-walk-stop
            sleep 2
            adb pull /sdcard/wisp-instruction-video.mp4 instruction-video-raw.mp4 || true
            # screenrecord's raw output has known non-monotonic timestamps that ffmpeg and
            # most players tolerate but VLC's decoder rejects outright ("Codec not
            # supported"). Re-encoding (not just remuxing) normalizes that and the pixel
            # format/profile into something every common player handles.
            if [ -s instruction-video-raw.mp4 ]; then ffmpeg -y -fflags +genpts -i instruction-video-raw.mp4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart instruction-video.mp4 || cp instruction-video-raw.mp4 instruction-video.mp4; fi
            # The rm -rf above clears /sdcard/wisp-screenshots before the walk even starts,
            # yet a run still pulled a 0-byte "3-detail.png" alongside the 15 real
            # captures (run 37106687105) - a name no current screenshot() call writes, so
            # it isn't a fresh write gone wrong. Only explanation left: the emulated
            # sdcard's FUSE layer (already flaky enough right after boot to need the
            # retried rm -rf above) dropped a since-renamed file's content but kept a
            # ghost, empty directory entry for it, which rm -rf on the whole directory
            # doesn't guarantee clears. That empty file then crashed the release
            # workflow's `convert` step on a corrupt PNG header. Delete anything 0 bytes
            # on-device right before the pull, so a ghost entry like that can never reach
            # the release workflow regardless of how it got there.
            adb shell "find /sdcard/wisp-screenshots -size 0 -delete" 2>/dev/null || true
            adb pull /sdcard/wisp-screenshots screenshots-raw

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: android/app/build/reports/androidTests/connected
          retention-days: 3
          if-no-files-found: warn

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: android/screenshots-raw
          retention-days: 1

      - name: Upload instruction video
        uses: actions/upload-artifact@v7
        with:
          name: instruction-video
          path: android/instruction-video.mp4
          retention-days: 1
          if-no-files-found: warn
