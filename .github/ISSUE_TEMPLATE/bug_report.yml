name: Bug report
description: Something in Wisp isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Wisp has four screens:

        - **Home** — the list of past activities and the Start button.
        - **Tracking** — the live map and stats shown while recording.
        - **Detail** — the map and stats for one past or just-finished activity.
        - **Km splits** — the per-kilometer breakdown, reached from Detail.

        Using these names below helps pinpoint the issue faster.

  - type: dropdown
    id: screen
    attributes:
      label: Which screen were you on?
      options:
        - Home (activity list / Start button)
        - Tracking (live recording)
        - Detail (a past or just-finished activity)
        - Km splits (per-kilometer breakdown, from Detail)
        - Not tied to a specific screen

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >
        What did you do, what did you expect, and what happened instead?
        If relevant, mention which control you used — e.g. **Start**,
        **Pause**/**Continue**, **Stop**, **Delete**, **Export CSV**,
        **Export Image**, or **Back**.
      placeholder: |
        1. On the Tracking screen, I tapped Pause...
        2. I expected the timer to stop...
        3. Instead...

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Home
        2. Tap Start
        3. ...

  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: >-
        Also shown by Wisp's ⓘ icon on Home, in this same format —
        you can copy it straight from there.
      placeholder: e.g. Pixel 7, Android 15

  - type: input
    id: app-version
    attributes:
      label: Wisp version
      description: >-
        Tap the ⓘ icon on Wisp's Home screen — it's shown right at the top
        of that view.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, logs, or other context.

  - type: textarea
    id: attachments
    attributes:
      label: Attachments (optional)
      description: >
        Drag and drop or paste files here — e.g. screenshots, screen
        recordings, an exported CSV/GPX, or logcat output.
