name: Feature request
description: Suggest something new, or a change to how Wisp behaves.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Wisp has four screens:

        - **Home** — the list of past activities and the Start button.
        - **Tracking** — the live map and stats shown while recording.
        - **Detail** — the map and stats for one past or just-finished activity.
        - **Km splits** — the per-kilometer breakdown, reached from Detail.

        Using these names below helps place the request correctly.

  # Keep this option list (and the markdown explainer above) in sync with
  # the screens defined in specs/ui-flows.md — see the note at the top of
  # that file.
  - type: dropdown
    id: screen
    attributes:
      label: Which screen does this affect (if any)?
      options:
        - Home (activity list / Start button)
        - Tracking (live recording)
        - Detail (a past or just-finished activity)
        - Km splits (per-kilometer breakdown, from Detail)
        - Not tied to a specific screen / a new screen

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do today that Wisp doesn't support well?

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: >
        Describe the change. If it involves an existing control, use its
        name — e.g. **Start**, **Pause**/**Continue**, **Stop**,
        **Delete**, **Export CSV**, **Export Image**, or **Back**.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you're using today, or other approaches.

  - type: textarea
    id: attachments
    attributes:
      label: Attachments (optional)
      description: >
        Drag and drop or paste files here — e.g. mockups, screenshots,
        or an example CSV/GPX.

